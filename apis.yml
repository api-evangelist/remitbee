aid: remitbee
name: Remitbee
description: >-
  Remitbee is a Canadian licensed money-services business (FINTRAC-regulated,
  founded 2014, Mississauga, Ontario) offering low-cost international money
  transfers from Canada to 100+ countries across 89 published corridors, along
  with CAD/USD currency exchange, mobile top-ups / recharge, international bill
  payments, gift cards, travel eSIMs, and business money-transfer accounts.
  Customers fund transfers via Interac e-Transfer, EFT bank transfer, bill
  payment, or debit card, with zero fees on transfers above $500 CAD and live,
  transparent exchange rates. Remitbee operates consumer web and iOS/Android
  apps; it exposes partner/embedded integration APIs but publishes no public
  self-serve developer portal, OpenAPI, or OAuth surface. It does publish a
  /llms.txt agent-ingestion index of its corridor pages. Added to the API
  Evangelist network as a 500 Global portfolio company.
